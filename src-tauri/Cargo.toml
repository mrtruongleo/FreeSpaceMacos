[package]
name = "freespace-macos"
version = "0.1.0"
description = "FreeSpace - macOS Storage Cleanup Tool"
authors = ["you"]
edition = "2021"

[lib]
name = "freespace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
trash = "5"
dirs = "6"
libc = "0.2"
